[project]
name = "python-ulid-django"
version = "1.5.0"
description = "ULID (Universally Unique Lexicographically Sortable Identifier) support for Django."
authors = [
    { name = "Xdynix", email = "Lizard.rar@gmail.com" },
]
dependencies = [
    "django<7.0.0,>=5.2.0",
    "python-ulid<5.0.0,>=3.0.0",
]
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5",
    "Framework :: Django :: 6",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/Xdynix/python-ulid-django"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "rust-just>=1.42.3",
]
lint = [
    "django-stubs[compatible-mypy]~=6.0.7",
    "mypy>=1.13.0,<2.4.0",
    "pre-commit>=4.2.0",
    "ruff>=0.16.0",
]
test = [
    "beautifulsoup4[lxml]>=4.13.3",
    "pytest-cov>=6.0.0",
    "pytest-django>=4.10.0",
    "pytest-mock>=3.14.0",
    "pytest-randomly>=3.16.0",
    "pytest>=9.0.0",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
# The distribution name normalizes to `python_ulid_django`, not the module name.
module-name = "ulid_django"

[tool.ruff]
cache-dir = ".cache/ruff"
src = ["src", "testsite"]

[tool.ruff.lint]
select = [
    "F", # Pyflakes
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "I", # isort
    "PGH", # pygrep-hooks
    "UP", # pyupgrade
    "S", # flake8-bandit
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "DJ", # flake8-django
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "FURB", # refurb
    "RUF", # Ruff-specific rules
]
ignore = [
    # Suppressed by ruff formatter.
    "W191", # tab-indentation
    "E111", # indentation-with-invalid-multiple
    "E114", # indentation-with-invalid-multiple-comment
    "E117", # over-indented
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = [
    "S101", # assert
]
"**/migrations/*.py" = [
    "RUF012", # mutable-class-default
]

[tool.mypy]
strict = true
cache_dir = ".cache/mypy"
mypy_path = "testsite"
num_workers = 8
python_version = "3.12"
plugins = [
    "mypy_django_plugin.main",
]

[tool.django-stubs]
django_settings_module = "testsite.settings"

[tool.pytest]
strict = true
DJANGO_SETTINGS_MODULE = "testsite.settings"
testpaths = ["tests"]
pythonpath = [".", "src", "testsite"]
cache_dir = ".cache/pytest"
addopts = [
    "--import-mode", "importlib",
    "--cov-config", "pyproject.toml",
    "--cov-report", "term:skip-covered",
    "--cov-report", "html",
    "--cov-fail-under", "100",
]

[tool.coverage.run]
branch = true
data_file = ".cache/coverage/data.db"
disable_warnings = ["no-data-collected"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@overload",
]

[tool.coverage.html]
directory = ".cache/cov-report"

[tool.markdownlint]
default = true
MD007 = { indent = 4 }
MD013 = { line_length = 88, strict = true }
